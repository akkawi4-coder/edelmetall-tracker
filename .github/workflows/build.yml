name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kurshistorie laden (optional, braucht Secret GOLDAPI_KEY)
        continue-on-error: true
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python3 scripts/fetch_history.py app/src/main/assets/history.json

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk EdelmetallTracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EdelmetallTracker-APK
          path: EdelmetallTracker.apk

      - name: Download-Seite aktualisieren (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Edelmetall Tracker 0.1 (Build ${{ github.run_number }})
          body: "APK zum Installieren: unten unter Assets auf EdelmetallTracker.apk tippen."
          files: EdelmetallTracker.apk
          make_latest: true
